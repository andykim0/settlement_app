[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "settlement-app"
version = "0.1.0"
description = "배달 정산 로컬 관리자 — layered PySide6 desktop app"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7",
    "playwright>=1.44",
    "imap-tools>=1.5",
    "keyring>=24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
]
db = [
    "psycopg[binary,pool]>=3.2",
]

[project.scripts]
settlement-app = "settlement_app.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/settlement_app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
